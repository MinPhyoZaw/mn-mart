name: manaw_mart_hotel
description: Standalone customer app for Manaw Mart hotel bookings.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  image_picker: ^1.1.2
  flutter_file_dialog: ^3.0.2
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/mn-mart-logo.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 600
